# Profile "standalone": no MySQL needed. Data is kept in ./data/civictrack.mv.db next to the program.
spring.datasource.url=jdbc:h2:file:./data/civictrack;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# frontend is served by this same server, so only one port (8080) is used
app.cors-origins=http://localhost:8080,http://127.0.0.1:8080
