server.port=8080
# never send exception messages in Spring's default error page (our handler returns safe messages)
server.error.include-message=never
server.error.include-stacktrace=never

# ---- MySQL (edit username/password, or set DB_USER / DB_PASSWORD environment variables) ----
spring.datasource.url=jdbc:mysql://localhost:3306/civictrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# 'update' only ADDS missing tables/columns, it never drops data. SchemaMigrator converts old ENUM columns safely.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT ----
# Set JWT_SECRET (32+ characters) in the environment. If it is empty a random secret is generated on every start.
app.jwt.secret=${JWT_SECRET:}
# when no secret is configured, one is generated ONCE and stored here (so logins survive restarts)
app.jwt.secret-file=data/jwt.secret
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ---- Uploads & CORS ----
app.upload-dir=uploads
app.cors-origins=http://localhost:5173,http://127.0.0.1:5173
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=27MB

# ---- Demo accounts (local development only). Set SEED_DEMO_ACCOUNTS=false in production. ----
app.seed.demo-accounts=${SEED_DEMO_ACCOUNTS:true}
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:}
app.seed.officer-password=${DEMO_OFFICER_PASSWORD:}
app.seed.citizen-password=${DEMO_CITIZEN_PASSWORD:}

# ---- SLA escalation check (milliseconds) ----
app.sla.initial-delay-ms=30000
app.sla.check-interval-ms=600000

# ---- Geocoding (Nominatim / OpenStreetMap). Set a real contact in the User-Agent (required by the usage policy). ----
app.geocoder.base-url=https://nominatim.openstreetmap.org
app.geocoder.user-agent=CivicTrack/2.0 (${GEOCODER_CONTACT:set-GEOCODER_CONTACT-env-var})
# optional: restrict results to countries, e.g. in  (comma separated ISO codes)
app.geocoder.country-codes=${GEOCODER_COUNTRIES:}
